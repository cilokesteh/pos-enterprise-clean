<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10b981">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<title>Login — POS Toko HP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="config.js"></script>
<script>
  (function() {
    var savedTheme = localStorage.getItem('pos-theme');
    document.documentElement.setAttribute('data-theme', savedTheme === 'light' ? 'light' : 'dark');
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  body { background:#020617; font-family:'Inter',system-ui,-apple-system,sans-serif; }
  html[data-theme="light"] { color-scheme:light; }
  html[data-theme="dark"] { color-scheme:dark; }
  html[data-theme="light"] body { background:#f4f4f5; color:#18181b; }
  html[data-theme="light"] .bg-zinc-900 { background-color:#fff !important; }
  html[data-theme="light"] .border-zinc-800 { border-color:#d4d4d8 !important; }
  html[data-theme="light"] .text-zinc-100 { color:#18181b !important; }
  html[data-theme="light"] .text-zinc-300 { color:#3f3f46 !important; }
  html[data-theme="light"] .text-zinc-400 { color:#52525b !important; }
  html[data-theme="light"] .text-zinc-600,
  html[data-theme="light"] .text-zinc-700 { color:#71717a !important; }
  html[data-theme="light"] input { color:#18181b; }
  .kbd { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; padding:0 6px; font-size:10px; font-family:monospace; background:#1e293b; border:1px solid #334155; border-bottom-width:2px; border-radius:5px; color:#94a3b8; }
  html[data-theme="light"] .kbd { background:#e4e4e7; border-color:#d4d4d8; color:#52525b; }
  .login-card {
    background: rgba(15,23,42,.7);
    border: 1px solid rgba(148,163,184,.12);
    box-shadow: 0 20px 60px -20px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.5);
    backdrop-filter: blur(12px);
    border-radius: 20px;
  }
  input:focus { border-color:#22c55e !important; box-shadow:0 0 0 3px rgba(34,197,94,.15) !important; outline:none; }
  #login-btn {
    background-image: linear-gradient(180deg,#22c55e,#059669);
    box-shadow: 0 4px 16px -4px rgba(34,197,94,.5);
    transition: filter .15s ease, transform .15s ease;
  }
  #login-btn:hover { filter:brightness(1.08); }
  #login-btn:disabled { filter:grayscale(.4) brightness(.8); }
</style>
</head>
<body class="min-h-screen flex items-center justify-center text-zinc-100">
  <div class="w-full max-w-sm px-6">
    <div class="login-card p-8">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl mb-4" style="background:linear-gradient(135deg,#22c55e,#059669); box-shadow:0 8px 24px -6px rgba(34,197,94,.6);">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
          </svg>
        </div>
        <h1 class="text-2xl font-bold" id="store-name">Toko HP</h1>
        <p class="text-sm text-zinc-400 mt-1">Masuk dengan akun Anda</p>
        <p class="text-[10px] text-zinc-600 mt-3"><span class="kbd">F1</span> fokus email · <span class="kbd">Enter</span> login</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm text-zinc-300 mb-1">Email</label>
          <input id="email" type="email" required autocomplete="email" autofocus
                 class="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-800 focus:border-emerald-500 focus:outline-none text-zinc-100">
        </div>
        <div>
          <label class="block text-sm text-zinc-300 mb-1">Password</label>
          <input id="password" type="password" required autocomplete="current-password"
                 class="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-800 focus:border-emerald-500 focus:outline-none text-zinc-100">
        </div>
        <button type="submit" id="login-btn"
                class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-semibold transition flex items-center justify-center gap-2">
          <span id="btn-text">Masuk</span>
          <span id="btn-spinner" class="hidden"><svg class="animate-spin h-4 w-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg></span>
        </button>
      </form>

      <div id="error" class="mt-4 text-sm text-red-400 text-center hidden"></div>
    </div>
    <p class="mt-6 text-xs text-zinc-600 text-center">POS Enterprise v11 · Clean Rebuild · Camera Scan + Filters + PDF Hybrid</p>
    <p class="mt-1 text-[10px] text-zinc-700 text-center">&copy; 2026 ciloktech.my.id</p>
  </div>

<script>
let auth = null;
function initFirebase() {
  if (auth) return true;
  if (typeof firebase === 'undefined') return false;
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth();
    return true;
  } catch (e) {
    console.error('Firebase init failed', e);
    return false;
  }
}
if (!initFirebase()) {
  document.addEventListener('DOMContentLoaded', function() {
    if (!initFirebase()) {
      document.body.innerHTML = '<div class="min-h-screen flex items-center justify-center text-red-400 p-6 text-center">⚠ Gagal memuat Firebase SDK. Periksa koneksi internet.</div>';
    }
  });
}
document.addEventListener('DOMContentLoaded', function() {
  if (typeof STORE !== 'undefined') {
    document.getElementById('store-name').textContent = STORE.name;
    document.title = 'Login — ' + STORE.name;
  }
});
if (auth) {
  auth.onAuthStateChanged(function(user) {
    if (user) window.location.href = 'index.html';
  });
}
document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  var btn = document.getElementById('login-btn');
  var btnText = document.getElementById('btn-text');
  var spinner = document.getElementById('btn-spinner');
  var errBox = document.getElementById('error');
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  errBox.classList.add('hidden');
  btn.disabled = true;
  if (btnText) btnText.textContent = 'Memproses...';
  if (spinner) spinner.classList.remove('hidden');
  try {
    await auth.signInWithEmailAndPassword(email, password);
    window.location.href = 'index.html';
  } catch (err) {
    var msg = err.message || 'Login gagal';
    if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
      msg = 'Email atau password salah';
    } else if (err.code === 'auth/too-many-requests') {
      msg = 'Terlalu banyak percobaan. Coba lagi nanti.';
    } else if (err.code === 'auth/network-request-failed') {
      msg = 'Gangguan jaringan. Periksa koneksi internet.';
    }
    errBox.textContent = msg;
    errBox.classList.remove('hidden');
    btn.disabled = false;
    if (btnText) btnText.textContent = 'Masuk';
    if (spinner) spinner.classList.add('hidden');
  }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'F1') { e.preventDefault(); var el = document.getElementById('email'); if(el) el.focus(); }
});
</script>
</body>
</html>
